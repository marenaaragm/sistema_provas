<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Prova - Professor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; width: 100%;">

    <div class="container">
        <div class="header">
            <h1>📚 Nova Prova</h1>
            <p>Questões abertas e de múltipla escolha</p>
        </div>

        <form id="provaForm">
            <!-- MODIFICAÇÃO: Campo substituído por seletores com estilos inline seguros -->
            <div class="form-group">
                <label>📖 Matéria *</label>
                
                <input type="hidden" id="materiaInput" name="materia" value="">
                
                <div class="materia-selector" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 8px;">
                    <button type="button" class="btn-materia" data-materia="Fundamentos de Segurança" style="flex: 1; min-width: 160px; padding: 14px; border: 2px solid #323238; background-color: #29292e; color: #a8a8b3; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;">
                        🛡️ Fundamentos de Segurança
                    </button>
                    <button type="button" class="btn-materia" data-materia="Matemática Discreta" style="flex: 1; min-width: 160px; padding: 14px; border: 2px solid #323238; background-color: #29292e; color: #a8a8b3; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;">
                        🧮 Matemática Discreta
                    </button>
                    <button type="button" class="btn-materia" data-materia="Desenvolvimento de Aplicativos" style="flex: 1; min-width: 160px; padding: 14px; border: 2px solid #323238; background-color: #29292e; color: #a8a8b3; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.9rem; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all 0.2s ease;">
                        📱 Desenv. de Aplicativos
                    </button>
                </div>
            </div>

    
            <!-- Data -->
            <div class="form-group">
                <label>📅 Data *</label>
                <input type="date" id="data" name="data" required>
            </div>

            <!-- Questões -->
            <div class="form-group full-width">
                <label>❓ Questões</label>
                <div id="questoesContainer"></div>
                <button type="button" class="btn-add-questao" onclick="adicionarQuestao()">
                    ➕ Nova Questão
                </button>
            </div>

            <div class="btn-container">
                <button type="button" class="btn btn-secondary" onclick="limparTudo()">🗑️ Limpar</button>
                <button type="submit" class="btn btn-primary">✨ Salvar Prova</button>
            </div>
        </form>

        <div id="successMessage" class="success" style="display:none">
            🎉 Prova salva com sucesso!
        </div>

        <div id="apiStatus" class="api-status" style="margin-top: 1rem; color: #333; font-size: 0.95rem;">
            Carregando status da API...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
