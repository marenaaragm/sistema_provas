<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Prova - Professor</title>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📚 Nova Prova</h1>
            <p>Questões abertas e de múltipla escolha</p>
        </div>

        <form id="provaForm">
            <!-- Matéria -->
            <div class="form-group">
                <label>📖 Matéria *</label>
                <input type="text" id="materiaInput" name="materia" 
                       placeholder="Digite a matéria..." required>
            </div>

            <!-- Data -->
            <div class="form-group">
                <label>📅 Data *</label>
                <input type="date" id="data" name="data" required>
            </div>

            <!-- Questões -->
            <div class="form-group full-width">
                <label>❓ Questões</label>
                <div id="questoesContainer"></div>
                <button type="button" class="btn-add-questao" onclick="adicionarQuestao()">
                    ➕ Nova Questão
                </button>
            </div>

            <div class="btn-container">
                <button type="button" class="btn btn-secondary" onclick="limparTudo()">🗑️ Limpar</button>
                <button type="submit" class="btn btn-primary">✨ Salvar Prova</button>
            </div>
        </form>

        <div id="successMessage" class="success" style="display:none">
            🎉 Prova salva com sucesso!
        </div>

        <div id="apiStatus" class="api-status" style="margin-top: 1rem; color: #333; font-size: 0.95rem;">
            Carregando status da API...
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
